
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudySprint | Welcome</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <section class="auth-section" id="auth">
        <div class="auth-card">

            <div class="auth-decoration" aria-hidden="true">✿</div>

            <p class="eyebrow">A LITTLE SPACE FOR BIG DREAMS</p>

            <h2>Your study journey starts here.</h2>

            <p>
                A calmer way to plan, organize and keep track
                of everything you're learning.
            </p>

            <div class="auth-buttons">
                <button type="button" id="showLogin" class="primary-button">
                    Log In
                </button>

                <button type="button" id="showRegister" class="secondary-button">
                    Sign Up
                </button>
            </div>

            <form id="authForm" class="task-form">

                <label for="authEmail">Email address</label>
                <input
                    type="email"
                    id="authEmail"
                    placeholder="you@example.com"
                    required
                >

                <label for="authPassword">Password</label>
                <input
                    type="password"
                    id="authPassword"
                    placeholder="At least 8 characters"
                    minlength="8"
                    maxlength="128"
                    required
                >

                <button type="submit" id="authSubmit" class="primary-button">
                    Log In
                </button>

                <p id="authMessage" role="status"></p>
            </form>

            <p class="auth-note">A fresh start, one task at a time. ♡</p>

        </div>
    </section>

    <footer>
        <p>Made for curious minds and big dreams. ♡</p>
        <p class="footer-subtitle">
            Study smart. Take little breaks. Enjoy your matcha. 🍵
        </p>
    </footer>

</body>
</html>
